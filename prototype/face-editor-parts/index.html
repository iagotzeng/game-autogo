<title>問道棋局湊臉</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root{
    color-scheme:dark;
    --bg:#111418; --bg-2:#181c22; --glass:rgba(20,24,30,.84); --glass-2:rgba(28,33,41,.92);
    --line:rgba(201,162,74,.28); --line-2:rgba(255,255,255,.08);
    --ink:#ece6d8; --ink-2:#9aa3ad; --ink-3:#6b737d;
    --gold:#c9a24a; --gold-2:#e8cd85; --ice:#7fd4f5;
    --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
    --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:13px;line-height:1.5;overflow:hidden}
  .app{height:100%;display:grid;grid-template-rows:auto 1fr auto;padding-inline:16px;padding-block:10px;gap:10px}
  .top{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .title{font-family:var(--serif);font-weight:700;font-size:20px;letter-spacing:.08em;white-space:nowrap}
  .title small{font-family:var(--sans);font-weight:400;font-size:11px;color:var(--ink-3);letter-spacing:.2em;margin-left:8px}
  .name{font-family:var(--serif);color:var(--gold-2);font-size:14px;letter-spacing:.1em;border-left:1px solid var(--line);padding-left:14px}
  .spacer{flex:1}
  .tools{display:flex;gap:6px;flex-wrap:wrap}
  .tb{border:1px solid var(--line-2);background:var(--glass);color:var(--ink);border-radius:3px;padding:6px 11px;font:inherit;font-size:12px;cursor:pointer;letter-spacing:.06em;white-space:nowrap}
  .tb:hover{border-color:var(--gold)}
  .tb[aria-pressed="true"]{border-color:var(--gold);color:var(--gold-2);background:rgba(201,162,74,.12)}
  .tb.gold{background:var(--gold);color:#1a1408;border-color:var(--gold);font-weight:700}
  .tb:disabled{opacity:.4;cursor:default}
  .tb:focus-visible,.cat:focus-visible,.opt:focus-visible,.sw:focus-visible,input:focus-visible,textarea:focus-visible,.thumb:focus-visible{outline:2px solid var(--ice);outline-offset:2px}
  .main{display:grid;grid-template-columns:76px minmax(300px,1fr) minmax(300px,400px);gap:12px;min-height:0}
  .rail{display:flex;flex-direction:column;gap:3px;overflow-y:auto;scrollbar-width:none;padding-block:2px}
  .cat{display:flex;flex-direction:column;align-items:center;gap:2px;border:1px solid transparent;background:transparent;color:var(--ink-2);padding:4px 4px;border-radius:4px;cursor:pointer;font:inherit}
  .cat .g{width:30px;height:30px;border-radius:50%;border:1px solid var(--line-2);display:grid;place-items:center;font-family:var(--serif);font-size:14px;font-weight:600;color:var(--ink)}
  .cat .n{font-size:10.5px;letter-spacing:.08em}
  .cat:hover .g{border-color:var(--gold)}
  .cat[aria-selected="true"]{color:var(--gold-2)}
  .cat[aria-selected="true"] .g{border-color:var(--gold);background:rgba(201,162,74,.14);color:var(--gold-2)}
  .stage{position:relative;min-height:0;display:grid;place-items:center;border:1px solid var(--line-2);border-radius:4px;background:radial-gradient(ellipse at 50% 40%,#232a33 0%,#151a20 70%);overflow:hidden}
  .stage svg{display:block;height:100%;width:100%;max-height:100%}
  .stage .cam{position:absolute;right:10px;top:10px;display:flex;gap:4px}
  .stage .cam .tb{padding:4px 9px}
  .panel{display:flex;flex-direction:column;min-height:0;border:1px solid var(--line-2);border-radius:4px;background:var(--glass)}
  .panel .head{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--line-2)}
  .panel .head h2{margin:0;font-family:var(--serif);font-size:15px;letter-spacing:.14em;color:var(--gold-2);font-weight:600}
  .body{overflow-y:auto;padding:12px 14px 16px;display:grid;gap:12px;scrollbar-width:thin}
  .gt{font-family:var(--serif);font-size:12px;letter-spacing:.2em;color:var(--ink-3);padding-top:8px;border-top:1px dashed var(--line-2);margin-bottom:-4px}
  .gt:first-child{border-top:0;padding-top:0}
  .opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
  .opt{border:1px solid var(--line-2);background:#0f1216;border-radius:4px;padding:4px 4px 5px;cursor:pointer;display:grid;gap:3px;color:var(--ink);font:inherit;text-align:center}
  .opt:hover{border-color:var(--gold)}
  .opt[aria-pressed="true"]{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset;background:rgba(201,162,74,.08)}
  .opt svg{width:100%;height:auto;border-radius:3px;background:#e9eef4}
  .opt .n{font-size:11px;letter-spacing:.06em}
  .colors{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .sw{width:26px;height:26px;border-radius:50%;border:2px solid var(--line-2);cursor:pointer;padding:0;background:none}
  .sw[aria-pressed="true"]{border-color:var(--gold-2);box-shadow:0 0 0 2px var(--bg-2),0 0 0 3px var(--gold)}
  .sw span{display:block;width:100%;height:100%;border-radius:50%}
  input[type=color]{width:32px;height:26px;border:1px solid var(--line-2);border-radius:3px;background:var(--bg-2);padding:2px;cursor:pointer}
  .lab{font-size:12px;letter-spacing:.04em}
  .bottom{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:space-between}
  .bottom .grp{display:flex;gap:6px;flex-wrap:wrap}
  .overlay{position:fixed;inset:0;background:rgba(8,10,13,.72);display:grid;place-items:center;padding:16px;z-index:10}

  .thumb .s{font-size:10px;color:var(--ink-3)}

  #qr img,#qr canvas{display:block;width:152px;height:152px}
  textarea{width:100%;min-height:64px;resize:vertical;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;border:1px solid var(--line-2);border-radius:3px;background:#0f1216;color:var(--ink);padding:8px}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .toast{font-size:12px;color:var(--gold-2);min-height:1.2em;letter-spacing:.04em}
  .muted{font-size:11px;color:var(--ink-3);margin:0}

    .cat{flex:0 0 auto;padding:6px 8px}
    .panel{max-height:62vh}
    .share{grid-template-columns:1fr}
  }
  @media (prefers-reduced-motion:no-preference){.tb,.opt,.cat .g,.thumb{transition:border-color .15s,background-color .15s,color .15s}}
</style>

<div class="app">

  <div class="bottom">

      <button class="tb" id="btnRandAll" type="button">隨機湊臉</button>
    </div>
    <span class="toast" id="toast" aria-live="polite"></span>
    <div class="grp">
      <button class="tb" id="btnSave" type="button">存入臉譜庫</button>

</div>

<div class="overlay" id="ovGallery" hidden>
  <div class="sheet" role="dialog" aria-labelledby="galTitle">
    <h3 id="galTitle">臉譜庫 <button class="tb" id="galClose" type="button">關閉</button></h3>
    <div class="gt">宗門預設</div>
    <div class="grid" id="galPresets"></div>
    <div class="gt">我的臉譜（存在這個瀏覽器）</div>
    <div class="grid" id="galSaved"></div>
    <p class="muted" id="galEmpty">還沒有存過臉譜。湊好後按「存入臉譜庫」。</p>
  </div>
</div>
<div class="overlay" id="ovShare" hidden>
  <div class="sheet" role="dialog" aria-labelledby="shTitle">
    <h3 id="shTitle">分享捏臉數據 <button class="tb" id="shClose" type="button">關閉</button></h3>
    <div class="share">
      <div id="qr" aria-label="捏臉數據二維碼"></div>
      <div style="display:grid;gap:8px">
        <label class="muted" for="codeOut">捏臉數據（複製給朋友，或用二維碼）</label>
        <textarea id="codeOut" readonly></textarea>
        <div class="row"><button class="tb" id="btnCopy" type="button">複製數據</button><span class="toast" id="toast2" aria-live="polite"></span></div>
        <label class="muted" for="codeIn">貼上別人的數據載入</label>
        <textarea id="codeIn" placeholder="WD5.…"></textarea>
        <div class="row"><button class="tb" id="btnImport" type="button">載入數據</button></div>
      </div>
    </div>
  </div>
</div>

function fromPreset(i){return Object.assign({},PRESETS[i].p);}
let P=fromPreset(0),currentPreset=0,activeCat='face',cam='face',compareBase=null;

/* ---------------- drawing helpers ---------------- */
function sc(pts){const n=pts.length;let d=`M${f(pts[0][0])} ${f(pts[0][1])}`;for(let i=0;i<n;i++){const p0=pts[(i-1+n)%n],p1=pts[i],p2=pts[(i+1)%n],p3=pts[(i+2)%n];d+=` C${f(p1[0]+(p2[0]-p0[0])/6)} ${f(p1[1]+(p2[1]-p0[1])/6)} ${f(p2[0]-(p3[0]-p1[0])/6)} ${f(p2[1]-(p3[1]-p1[1])/6)} ${f(p2[0])} ${f(p2[1])}`;}return d+'Z';}
function so(pts){const n=pts.length;let d=`M${f(pts[0][0])} ${f(pts[0][1])}`;for(let i=0;i<n-1;i++){const p0=pts[Math.max(0,i-1)],p1=pts[i],p2=pts[i+1],p3=pts[Math.min(n-1,i+2)];d+=` C${f(p1[0]+(p2[0]-p0[0])/6)} ${f(p1[1]+(p2[1]-p0[1])/6)} ${f(p2[0]-(p3[0]-p1[0])/6)} ${f(p2[1]-(p3[1]-p1[1])/6)} ${f(p2[0])} ${f(p2[1])}`;}return d;}
const cub=(p0,p1,p2,p3,t)=>{const u=1-t;return [u*u*u*p0[0]+3*u*u*t*p1[0]+3*u*t*t*p2[0]+t*t*t*p3[0],u*u*u*p0[1]+3*u*u*t*p1[1]+3*u*t*t*p2[1]+t*t*t*p3[1]];};
// tapered stroke along a cubic: width profile w(t)
function taperCubic(p0,p1,p2,p3,wfn,N){N=N||18;const up=[],dn=[];for(let i=0;i<=N;i++){const t=i/N;const p=cub(p0,p1,p2,p3,t);const q=cub(p0,p1,p2,p3,Math.min(1,t+0.01)),r=cub(p0,p1,p2,p3,Math.max(0,t-0.01));let dx=q[0]-r[0],dy=q[1]-r[1];const l=Math.hypot(dx,dy)||1;dx/=l;dy/=l;const w=wfn(t);up.push([p[0]-dy*w/2,p[1]+dx*w/2]);dn.push([p[0]+dy*w/2,p[1]-dx*w/2]);}return 'M'+up.concat(dn.reverse()).map(p=>f(p[0])+' '+f(p[1])).join(' L ')+'Z';}
const MIR='transform="matrix(-1 0 0 1 600 0)"';

/* ---------------- renderer ---------------- */
const CX=300;
function render(svgEl,P,opts){

// tapered strand from a polyline (Catmull-Rom sampled)
function taperCubicFromPoly(pts,w0,w1){const n=pts.length;const samples=[];const N=6;for(let i=0;i<n-1;i++){const p0=pts[Math.max(0,i-1)],p1=pts[i],p2=pts[i+1],p3=pts[Math.min(n-1,i+2)];const c1=[p1[0]+(p2[0]-p0[0])/6,p1[1]+(p2[1]-p0[1])/6],c2=[p2[0]-(p3[0]-p1[0])/6,p2[1]-(p3[1]-p1[1])/6];for(let k=(i?1:0);k<=N;k++)samples.push(cub(p1,c1,c2,p2,k/N));}
  const M=samples.length;const up=[],dn=[];for(let i=0;i<M;i++){const t=i/(M-1);const p=samples[i];const q=samples[Math.min(M-1,i+1)],r=samples[Math.max(0,i-1)];let dx=q[0]-r[0],dy=q[1]-r[1];const l=Math.hypot(dx,dy)||1;dx/=l;dy/=l;let w=w0+(w1-w0)*t;if(t>0.82)w*=Math.max(0.08,(1-t)/0.18);if(t<0.08)w*=0.6+0.4*t/0.08;up.push([p[0]-dy*w/2,p[1]+dx*w/2]);dn.push([p[0]+dy*w/2,p[1]-dx*w/2]);}
  return 'M'+up.concat(dn.reverse()).map(p=>f(p[0])+' '+f(p[1])).join(' L ')+'Z';}

/* ---------------- encode / history ---------------- */
function encode(o){o=o||P;return 'WD5.'+btoa(KEYS.map(k=>COLOR_KEYS.includes(k)?String(o[k]).replace('#',''):String(o[k])).join(','));}
function decode(str){str=(str||'').trim();if(!str.startsWith('WD5.'))return null;let raw;try{raw=atob(str.slice(4));}catch(e){return null;}const parts=raw.split(',');if(parts.length!==KEYS.length)return null;const o={};for(let i=0;i<KEYS.length;i++){const k=KEYS[i],v=parts[i];if(COLOR_KEYS.includes(k)){if(!/^[0-9a-fA-F]{6}$/.test(v))return null;o[k]='#'+v.toLowerCase();}else{const n=parseInt(v,10);if(isNaN(n))return null;o[k]=clamp(n,0,MAX[k]);}}return o;}
const hist={u:[],r:[]};let lastCommitted='';
function commit(){const c=encode();if(c===lastCommitted)return;hist.u.push(lastCommitted);if(hist.u.length>60)hist.u.shift();hist.r.length=0;lastCommitted=c;refreshHistBtns();persist();}
function undo(){if(!hist.u.length)return;hist.r.push(lastCommitted);const c=hist.u.pop();P=decode(c);lastCommitted=c;currentPreset=-1;refreshAll();refreshHistBtns();persist();}
function redo(){if(!hist.r.length)return;hist.u.push(lastCommitted);const c=hist.r.pop();P=decode(c);lastCommitted=c;currentPreset=-1;refreshAll();refreshHistBtns();persist();}
function refreshHistBtns(){$('#btnUndo').disabled=!hist.u.length;$('#btnRedo').disabled=!hist.r.length;}
function persist(){try{localStorage.setItem('wd5_last',encode());localStorage.setItem('wd5_preset',String(currentPreset));}catch(e){}}

  $('#ovGallery').hidden=false;}
function closeOv(sel){$(sel).hidden=true;}
function saveFace(){const arr=loadSaved();const d=new Date();arr.unshift({name:'臉譜 '+(arr.length+1),code:encode(),date:`${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`});if(arr.length>12)arr.length=12;try{localStorage.setItem('wd5_saved',JSON.stringify(arr));toast('已存入臉譜庫（這個瀏覽器）');}catch(e){toast('這個瀏覽器不允許儲存，請改用分享數據');}}
function openShare(){const code=encode();$('#codeOut').value=code;const box=$('#qr');box.innerHTML='';try{if(window.QRCode){new QRCode(box,{text:code,width:152,height:152,colorDark:'#1d2530',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M});}else box.textContent='二維碼元件未載入，請用文字數據。';}catch(e){box.textContent='數據過長，請用文字數據。';}$('#ovShare').hidden=false;}
const pick=arr=>arr[Math.floor(Math.random()*arr.length)];const rnd=(a,b)=>Math.round(a+Math.random()*(b-a));
function randomize(keys){keys.forEach(k=>{if(k==='skin')P.skin=pick(SKINS);else if(k==='hair')P.hair=pick(HAIRS);else if(k==='iris')P.iris=pick(IRISES);else P[k]=rnd(0,MAX[k]);});
  if(keys.includes('back')){if(P.back===5)P.bangs=7;else if(P.bangs===7)P.bangs=rnd(0,6);}
  if(keys.includes('mark')&&Math.random()<0.5)P.mark=0;if(keys.includes('extra')&&Math.random()<0.6)P.extra=0;currentPreset=-1;refreshAll();commit();}

/* wire */
buildRail();
$('#camFace').addEventListener('click',()=>{cam='face';$('#camFace').setAttribute('aria-pressed','true');$('#camBody').setAttribute('aria-pressed','false');draw();});
$('#camBody').addEventListener('click',()=>{cam='body';$('#camFace').setAttribute('aria-pressed','false');$('#camBody').setAttribute('aria-pressed','true');draw();});
const cmp=$('#btnCompare');const cmpOn=()=>{compareBase=currentPreset>=0?fromPreset(currentPreset):(hist.u.length?decode(hist.u[0]):null);if(!compareBase){toast('目前沒有可對比的原貌');return;}cmp.setAttribute('aria-pressed','true');draw();};const cmpOff=()=>{if(!compareBase)return;compareBase=null;cmp.setAttribute('aria-pressed','false');draw();};
cmp.addEventListener('pointerdown',e=>{e.preventDefault();cmpOn();});cmp.addEventListener('pointerup',cmpOff);cmp.addEventListener('pointerleave',cmpOff);cmp.addEventListener('pointercancel',cmpOff);cmp.addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();cmpOn();}});cmp.addEventListener('keyup',cmpOff);
$('#btnUndo').addEventListener('click',undo);$('#btnRedo').addEventListener('click',redo);
$('#btnRandCat').addEventListener('click',()=>{const cat=CATS.find(c=>c.id===activeCat);randomize(cat.color?['skin','hair','iris']:[cat.k].concat((cat.also||[]).map(x=>x.k)));toast('隨機了「'+cat.name+'」');});
$('#btnRandAll').addEventListener('click',()=>{randomize(KEYS);toast('隨機湊了一張臉');});
$('#btnGallery').addEventListener('click',openGallery);$('#galClose').addEventListener('click',()=>closeOv('#ovGallery'));
$('#btnSave').addEventListener('click',saveFace);$('#btnShare').addEventListener('click',openShare);$('#shClose').addEventListener('click',()=>closeOv('#ovShare'));
document.querySelectorAll('.overlay').forEach(ov=>ov.addEventListener('click',e=>{if(e.target===ov)ov.hidden=true;}));
document.addEventListener('keydown',e=>{if(e.key==='Escape'){document.querySelectorAll('.overlay').forEach(o=>o.hidden=true);}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();if(e.shiftKey)redo();else undo();}});
$('#btnCopy').addEventListener('click',()=>{const ta=$('#codeOut');const txt=ta.value;const fb=()=>{ta.focus();ta.select();toast('已選取數據，請按複製','#toast2');};if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(()=>toast('數據已複製','#toast2')).catch(fb);}else fb();});
$('#btnImport').addEventListener('click',()=>{const o=decode($('#codeIn').value);if(o){P=o;currentPreset=-1;refreshAll();commit();closeOv('#ovShare');toast('數據已載入');}else toast('數據格式不對，請確認以 WD5. 開頭且完整','#toast2');});

function start(data){let loaded=false;
  if(data&&data.code){const o=decode(data.code);if(o){P=o;currentPreset=typeof data.preset==='number'?data.preset:-1;loaded=true;}}
  if(!loaded){try{const c=localStorage.getItem('wd5_last');const o=c&&decode(c);if(o){P=o;const pi=parseInt(localStorage.getItem('wd5_preset')||'-1',10);currentPreset=isNaN(pi)?-1:pi;loaded=true;}const t=localStorage.getItem('wd5_cat');if(t&&CATS.some(x=>x.id===t)){activeCat=t;refreshRail();}}catch(e){}}
  if(!loaded){P=fromPreset(0);currentPreset=0;}
  lastCommitted=encode();refreshAll();refreshHistBtns();}
try{window.claude?.hot?.snapshot?.(()=>({code:encode(),preset:currentPreset}));}catch(e){}
if(window.claude?.hot?.ready){window.claude.hot.ready(start);}else{start(window.claude?.hot?.data??{});}
})();
</script>
