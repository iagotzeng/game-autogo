<title>問道棋局捏臉</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  /* Single dark theme by choice: the creator is a full-screen game screen, painted explicitly. */
  :root{
    color-scheme:dark;
    --bg:#111418; --bg-2:#181c22; --glass:rgba(20,24,30,.82); --glass-2:rgba(28,33,41,.9);
    --line:rgba(201,162,74,.28); --line-2:rgba(255,255,255,.08);
    --ink:#ece6d8; --ink-2:#9aa3ad; --ink-3:#6b737d;
    --gold:#c9a24a; --gold-2:#e8cd85; --ice:#7fd4f5; --blue:#5b7fc2;
    --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
    --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:13px;line-height:1.5;overflow:hidden}
  .app{height:100%;display:grid;grid-template-rows:auto 1fr auto;padding-inline:16px;padding-block:10px;gap:10px}
  .top{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .title{font-family:var(--serif);font-weight:700;font-size:20px;letter-spacing:.08em;white-space:nowrap}
  .title small{font-family:var(--sans);font-weight:400;font-size:11px;color:var(--ink-3);letter-spacing:.2em;margin-left:8px}
  .name{font-family:var(--serif);color:var(--gold-2);font-size:14px;letter-spacing:.1em;border-left:1px solid var(--line);padding-left:14px}
  .spacer{flex:1}
  .tools{display:flex;gap:6px;flex-wrap:wrap}
  .tb{border:1px solid var(--line-2);background:var(--glass);color:var(--ink);border-radius:3px;padding:6px 11px;font:inherit;font-size:12px;cursor:pointer;letter-spacing:.06em;white-space:nowrap}
  .tb:hover{border-color:var(--gold)}
  .tb[aria-pressed="true"]{border-color:var(--gold);color:var(--gold-2);background:rgba(201,162,74,.12)}
  .tb.gold{background:var(--gold);color:#1a1408;border-color:var(--gold);font-weight:700}
  .tb:disabled{opacity:.4;cursor:default}
  .tb:focus-visible,.cat:focus-visible,.chip:focus-visible,.sw:focus-visible,input:focus-visible,textarea:focus-visible,.thumb:focus-visible{outline:2px solid var(--ice);outline-offset:2px}
  .main{display:grid;grid-template-columns:76px 1fr minmax(280px,360px);gap:12px;min-height:0}
  .rail{display:flex;flex-direction:column;gap:4px;overflow-y:auto;scrollbar-width:none;padding-block:2px}
  .cat{display:flex;flex-direction:column;align-items:center;gap:2px;border:1px solid transparent;background:transparent;color:var(--ink-2);padding:5px 4px;border-radius:4px;cursor:pointer;font:inherit}
  .cat .g{width:32px;height:32px;border-radius:50%;border:1px solid var(--line-2);display:grid;place-items:center;font-family:var(--serif);font-size:15px;font-weight:600;color:var(--ink)}
  .cat .n{font-size:11px;letter-spacing:.1em}
  .cat:hover .g{border-color:var(--gold)}
  .cat[aria-selected="true"]{color:var(--gold-2)}
  .cat[aria-selected="true"] .g{border-color:var(--gold);background:rgba(201,162,74,.14);color:var(--gold-2)}
  .stage{position:relative;min-height:0;display:grid;place-items:center;border:1px solid var(--line-2);border-radius:4px;background:radial-gradient(ellipse at 50% 40%,#232a33 0%,#151a20 70%);overflow:hidden}
  .stage svg{display:block;height:100%;width:100%;max-height:100%;touch-action:none}
  .stage .hint{position:absolute;left:12px;bottom:10px;font-size:11px;color:var(--ink-3);letter-spacing:.08em;pointer-events:none}
  .stage .cam{position:absolute;right:10px;top:10px;display:flex;gap:4px}
  .stage .cam .tb{padding:4px 9px}
  .handle{cursor:grab}
  .handle:active{cursor:grabbing}
  .panel{display:flex;flex-direction:column;min-height:0;border:1px solid var(--line-2);border-radius:4px;background:var(--glass)}
  .panel .head{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--line-2)}
  .panel .head h2{margin:0;font-family:var(--serif);font-size:15px;letter-spacing:.14em;color:var(--gold-2);font-weight:600}
  .sidepick{display:flex;gap:2px}
  .sidepick[hidden]{display:none}
  .sidepick .tb{padding:3px 9px;font-size:11px}
  .body{overflow-y:auto;padding:12px 14px 16px;display:grid;gap:13px;scrollbar-width:thin}
  .ctl{display:grid;gap:5px}
  .ctl .lab{display:flex;justify-content:space-between;align-items:baseline;font-size:12px}
  .ctl .lab b{font-weight:500;letter-spacing:.04em}
  .ctl .lab .v{font-variant-numeric:tabular-nums;color:var(--ink-3);font-size:11px}
  input[type=range]{width:100%;accent-color:var(--gold);margin:0;height:22px}
  .choices{display:flex;flex-wrap:wrap;gap:5px}
  .chip{border:1px solid var(--line-2);background:transparent;color:var(--ink);border-radius:3px;padding:3px 10px;font:inherit;font-size:12px;cursor:pointer}
  .chip:hover{border-color:var(--gold)}
  .chip[aria-pressed="true"]{border-color:var(--gold);background:rgba(201,162,74,.16);color:var(--gold-2)}
  .colors{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .sw{width:24px;height:24px;border-radius:50%;border:2px solid var(--line-2);cursor:pointer;padding:0;background:none}
  .sw[aria-pressed="true"]{border-color:var(--gold-2);box-shadow:0 0 0 2px var(--bg-2),0 0 0 3px var(--gold)}
  .sw span{display:block;width:100%;height:100%;border-radius:50%}
  input[type=color]{width:32px;height:26px;border:1px solid var(--line-2);border-radius:3px;background:var(--bg-2);padding:2px;cursor:pointer}
  .gt{font-family:var(--serif);font-size:12px;letter-spacing:.2em;color:var(--ink-3);padding-top:8px;border-top:1px dashed var(--line-2);margin-bottom:-4px}
  .gt:first-child{border-top:0;padding-top:0}
  .bottom{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:space-between}
  .bottom .grp{display:flex;gap:6px;flex-wrap:wrap}
  .overlay{position:fixed;inset:0;background:rgba(8,10,13,.72);display:grid;place-items:center;padding:16px;z-index:10}
  .overlay[hidden]{display:none}
  .sheet{width:min(860px,100%);max-height:90vh;overflow:auto;background:var(--glass-2);border:1px solid var(--line);border-radius:6px;padding:16px 18px 20px;display:grid;gap:14px}
  .sheet h3{margin:0;font-family:var(--serif);font-size:16px;letter-spacing:.16em;color:var(--gold-2);display:flex;justify-content:space-between;align-items:center}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
  .thumb{border:1px solid var(--line-2);background:#0f1216;border-radius:4px;padding:6px;cursor:pointer;display:grid;gap:4px;text-align:center;color:var(--ink);font:inherit}
  .thumb:hover{border-color:var(--gold)}
  .thumb svg{width:100%;height:auto;border-radius:3px}
  .thumb .t{font-family:var(--serif);font-size:12px;letter-spacing:.08em}
  .thumb .s{font-size:10px;color:var(--ink-3)}
  .share{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start}
  #qr{width:168px;height:168px;background:#fff;padding:8px;border-radius:4px;color:#1d2530;font-size:11px}
  #qr img,#qr canvas{display:block;width:152px;height:152px}
  textarea{width:100%;min-height:64px;resize:vertical;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;border:1px solid var(--line-2);border-radius:3px;background:#0f1216;color:var(--ink);padding:8px}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .toast{font-size:12px;color:var(--gold-2);min-height:1.2em;letter-spacing:.04em}
  .muted{font-size:11px;color:var(--ink-3);margin:0}
  @media (max-width:900px){
    body{overflow:auto}
    .app{height:auto}
    .main{grid-template-columns:1fr;grid-template-rows:auto minmax(52vh,60vh) auto}
    .rail{flex-direction:row;overflow-x:auto;overflow-y:hidden}
    .cat{flex:0 0 auto;padding:6px 8px}
    .panel{max-height:60vh}
    .share{grid-template-columns:1fr}
  }
  @media (prefers-reduced-motion:no-preference){
    .tb,.chip,.cat .g,.thumb{transition:border-color .15s,background-color .15s,color .15s}
  }
</style>

<div class="app">
  <div class="top">
    <div class="title">問道棋局 · 捏臉<small>原型 v0.2</small></div>
    <div class="name" id="metaName">青雲劍修</div>
    <div class="spacer"></div>
    <div class="tools">
      <button class="tb" id="btnGallery" type="button">臉譜庫</button>
      <button class="tb" id="btnSym" type="button" aria-pressed="true">左右對稱</button>
      <button class="tb" id="btnLight" type="button">光照：正面</button>
      <button class="tb" id="btnCompare" type="button">按住對比原貌</button>
    </div>
  </div>

  <div class="main">
    <nav class="rail" id="rail" role="tablist" aria-label="捏臉分區"></nav>
    <section class="stage" id="stage" aria-label="角色預覽">
      <svg id="svg" viewBox="0 0 600 760" role="img" aria-label="角色立繪"></svg>
      <div class="cam">
        <button class="tb" id="camFull" type="button" aria-pressed="true">半身</button>
        <button class="tb" id="camFace" type="button" aria-pressed="false">臉部</button>
      </div>
      <div class="hint" id="hint">拖曳臉上的金色控制點可直接調整（下巴點：上下拉臉長、左右拉尖方）</div>
    </section>
    <aside class="panel" aria-label="細調">
      <div class="head"><h2 id="panelTitle">骨相</h2><div class="sidepick" id="sidepick" hidden>
        <button class="tb" id="sideL" type="button" aria-pressed="true">左</button>
        <button class="tb" id="sideR" type="button" aria-pressed="false">右</button>
      </div></div>
      <div class="body" id="panelBody"></div>
    </aside>
  </div>

  <div class="bottom">
    <div class="grp">
      <button class="tb" id="btnUndo" type="button" disabled>撤銷</button>
      <button class="tb" id="btnRedo" type="button" disabled>重做</button>
      <button class="tb" id="btnRandCat" type="button">隨機本區</button>
      <button class="tb" id="btnRandAll" type="button">隨機全臉</button>
      <button class="tb" id="btnReset" type="button">重置本區</button>
    </div>
    <span class="toast" id="toast" aria-live="polite"></span>
    <div class="grp">
      <button class="tb" id="btnSave" type="button">存入臉譜庫</button>
      <button class="tb gold" id="btnShare" type="button">分享捏臉數據</button>
    </div>
  </div>
</div>

<div class="overlay" id="ovGallery" hidden>
  <div class="sheet" role="dialog" aria-labelledby="galTitle">
    <h3 id="galTitle">臉譜庫 <button class="tb" id="galClose" type="button">關閉</button></h3>
    <div class="gt">宗門預設</div>
    <div class="grid" id="galPresets"></div>
    <div class="gt">我的臉譜（存在這個瀏覽器）</div>
    <div class="grid" id="galSaved"></div>
    <p class="muted" id="galEmpty">還沒有存過臉譜。捏好後按「存入臉譜庫」。</p>
  </div>
</div>

<div class="overlay" id="ovShare" hidden>
  <div class="sheet" role="dialog" aria-labelledby="shTitle">
    <h3 id="shTitle">分享捏臉數據 <button class="tb" id="shClose" type="button">關閉</button></h3>
    <div class="share">
      <div id="qr" aria-label="捏臉數據二維碼"></div>
      <div style="display:grid;gap:8px">
        <label class="muted" for="codeOut">捏臉數據（複製給朋友，或用二維碼）</label>
        <textarea id="codeOut" readonly></textarea>
        <div class="row"><button class="tb" id="btnCopy" type="button">複製數據</button><span class="toast" id="toast2" aria-live="polite"></span></div>
        <label class="muted" for="codeIn">貼上別人的數據載入</label>
        <textarea id="codeIn" placeholder="WD2.…"></textarea>
        <div class="row"><button class="tb" id="btnImport" type="button">載入數據</button></div>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
'use strict';
const $=s=>document.querySelector(s);
const lerp=(a,b,t)=>a+(b-a)*(t/100);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const f=n=>(Math.round(n*10)/10).toString();

function hex2rgb(h){h=h.replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');const n=parseInt(h,16);return [(n>>16)&255,(n>>8)&255,n&255];}
function rgb2hex(r,g,b){return '#'+[r,g,b].map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('');}
function mix(a,b,t){const A=hex2rgb(a),B=hex2rgb(b);return rgb2hex(A[0]+(B[0]-A[0])*t,A[1]+(B[1]-A[1])*t,A[2]+(B[2]-A[2])*t);}
const shade=(h,t)=>mix(h,'#1d2530',t), tint=(h,t)=>mix(h,'#ffffff',t);
function luma(h){const [r,g,b]=hex2rgb(h);return (0.299*r+0.587*g+0.114*b)/255;}

const SKINS=['#f4e6dc','#f1d9c6','#e9cdb5','#d9b592','#c2946c','#8f6247'];
const HAIRS=['#f2f4f7','#c9ced6','#8a8f99','#3b2a22','#1f1b1d','#6b3f2a','#a8743a','#5b7fc2','#8e5aa8'];
const IRISES=['#6fc3e6','#3d6fb8','#5a8a4a','#4a3c32','#c43a3a','#e0a030','#8e5aa8','#7c8a99'];
const SHADOWS=[['無',null],['淡紅','#d8707a'],['冰藍','#7fd4f5'],['煙灰','#5a6472'],['赤金','#d9a03a']];
const LIPS=[['自然',null],['朱紅','#b8302b'],['淡粉','#e8a0a8'],['紫黑','#4a2a3c'],['冰藍','#7fb8d8']];
const AURAS=[['金','#e8d27a'],['木','#8fd39a'],['水','#7fb8f5'],['火','#f59a7f'],['土','#d4b58a'],['雷','#c9a6ff'],['冰','#7fd4f5'],['風','#b8e8d8']];
const ROBES=[['青雲宗','#f7f9fb','#5b7fc2','#c9d6ee'],['神農谷','#e6efe2','#3f7a4e','#b9d6bf'],['大雷音寺','#f2d9a6','#b8862b','#e7c26a'],['血河宗','#2b2530','#a3262b','#5a2f39'],['萬妖山','#c9a77a','#6b4a2b','#a8743a'],['逍遙居','#d9dde3','#4a4e8a','#a9adc6']];

const SIDE_KEYS=['eyeDist','eyeH','eyeTilt','eyeSize','browH','browDist','browTilt','browThick','earSize','earAngle'];
const CATS=[
  {id:'bone',g:'骨',name:'骨相',controls:[
    {t:'group',n:'輪廓'},
    {k:'faceLen',t:'slider',n:'臉長'},{k:'faceWid',t:'slider',n:'臉寬'},{k:'jaw',t:'slider',n:'下顎寬'},{k:'cheek',t:'slider',n:'顴骨'},{k:'chin',t:'slider',n:'下巴（尖 → 方）'},
    {t:'group',n:'膚色'},{k:'skin',t:'color',n:'膚色',sw:SKINS}
  ]},
  {id:'brow',g:'眉',name:'眉',controls:[
    {k:'browType',t:'choice',n:'眉型',o:['劍眉','柳葉眉','平眉','粗眉']},
    {k:'browH',t:'slider',n:'眉高',side:1},{k:'browDist',t:'slider',n:'眉距',side:1},{k:'browThick',t:'slider',n:'眉濃',side:1},{k:'browTilt',t:'slider',n:'眉勢（垂 → 揚）',side:1}
  ]},
  {id:'eye',g:'眼',name:'眼',controls:[
    {k:'eyeType',t:'choice',n:'眼型',o:['銳利','圓潤','狹長','下垂']},
    {k:'eyeDist',t:'slider',n:'眼距',side:1},{k:'eyeH',t:'slider',n:'眼位（高 → 低）',side:1},{k:'eyeTilt',t:'slider',n:'眼角（垂 → 揚）',side:1},{k:'eyeSize',t:'slider',n:'眼大小',side:1},
    {k:'iris',t:'color',n:'瞳色',sw:IRISES},{k:'lashes',t:'choice',n:'睫毛',o:['無','有']}
  ]},
  {id:'nose',g:'鼻',name:'鼻',controls:[
    {k:'noseType',t:'choice',n:'鼻型',o:['挺直','小巧','鷹鉤']},
    {k:'noseH',t:'slider',n:'鼻位（高 → 低）'},{k:'noseW',t:'slider',n:'鼻寬'},{k:'noseL',t:'slider',n:'鼻長'}
  ]},
  {id:'mouth',g:'嘴',name:'嘴',controls:[
    {k:'mouthType',t:'choice',n:'嘴型',o:['冷峻','微笑','抿唇','厚唇']},
    {k:'mouthH',t:'slider',n:'嘴位（高 → 低）'},{k:'mouthW',t:'slider',n:'嘴寬'},{k:'mouthThick',t:'slider',n:'嘴厚'},{k:'mouthCorner',t:'slider',n:'嘴角（垂 → 揚）'}
  ]},
  {id:'ear',g:'耳',name:'耳',controls:[
    {k:'earSize',t:'slider',n:'耳大小',side:1},{k:'earAngle',t:'slider',n:'耳外張',side:1}
  ]},
  {id:'skin',g:'皮',name:'皮相',controls:[
    {k:'wocan',t:'choice',n:'臥蠶',o:['無','有']},
    {k:'faling',t:'slider',n:'法令紋'},{k:'wrinkle',t:'slider',n:'眼尾紋'},
    {k:'mole',t:'choice',n:'痣',o:['無','眼下','唇邊','眉間']},
    {k:'freckles',t:'choice',n:'雀斑',o:['無','有']}
  ]},
  {id:'hair',g:'髮',name:'髮',controls:[
    {k:'hairStyle',t:'choice',n:'髮型',o:['道髻長髮','高馬尾','披髮','短髮','光頭','半束髮']},
    {k:'bangs',t:'choice',n:'瀏海',o:['中分','斜瀏海','齊瀏海','無瀏海']},
    {k:'hairColor',t:'color',n:'髮色',sw:HAIRS},
    {k:'hairpin',t:'choice',n:'髮簪',o:['無','銀簪','玉簪']},
    {k:'beard',t:'choice',n:'鬍鬚',o:['無','山羊鬍','八字鬍','絡腮鬍']}
  ]},
  {id:'makeup',g:'妝',name:'妝容',controls:[
    {t:'group',n:'眼妝'},
    {k:'eyeShadow',t:'choice',n:'眼影',o:SHADOWS.map(s=>s[0])},{k:'shadowInt',t:'slider',n:'眼影濃度'},
    {k:'eyeliner',t:'choice',n:'眼線',o:['無','內眼線','上揚眼線']},
    {t:'group',n:'頰與唇'},
    {k:'blush',t:'slider',n:'腮紅'},
    {k:'lipColor',t:'choice',n:'唇色',o:LIPS.map(l=>l[0])},{k:'lipInt',t:'slider',n:'唇色濃度'},
    {k:'dimple',t:'choice',n:'面靨',o:['無','有']}
  ]},
  {id:'mark',g:'紋',name:'紋飾',controls:[
    {k:'forehead',t:'choice',n:'額飾',o:['無','冰晶花鈿','朱砂','金印']},
    {k:'daoMark',t:'choice',n:'道紋',o:['無','雙頰道紋','眉心道紋']},
    {k:'scar',t:'choice',n:'疤痕',o:['無','左眼疤','右頰疤']}
  ]},
  {id:'robe',g:'衣',name:'服飾',controls:[
    {k:'robe',t:'choice',n:'宗門道袍',o:ROBES.map(r=>r[0])},
    {k:'aura',t:'choice',n:'靈根氣息',o:AURAS.map(a=>a[0])},
    {k:'halo',t:'choice',n:'境界光效',o:['無','金丹光環']}
  ]}
];
const BASE_KEYS=['faceLen','faceWid','jaw','cheek','chin','skin','browType','browH','browDist','browThick','browTilt','eyeType','eyeDist','eyeH','eyeTilt','eyeSize','iris','lashes','noseType','noseH','noseW','noseL','mouthType','mouthH','mouthW','mouthThick','mouthCorner','earSize','earAngle','wocan','faling','wrinkle','mole','freckles','hairStyle','bangs','hairColor','hairpin','beard','eyeShadow','shadowInt','eyeliner','blush','lipColor','lipInt','dimple','forehead','daoMark','scar','robe','aura','halo','sym','light'];
const KEYS=BASE_KEYS.concat(SIDE_KEYS.map(k=>k+'_L'),SIDE_KEYS.map(k=>k+'_R'));
const CHOICE_MAX={browType:3,eyeType:3,lashes:1,noseType:2,mouthType:3,wocan:1,mole:3,freckles:1,hairStyle:5,bangs:3,hairpin:2,beard:3,eyeShadow:4,eyeliner:2,lipColor:4,dimple:1,forehead:3,daoMark:2,scar:2,robe:5,aura:7,halo:1,sym:1,light:2};

/* ---------- encode / decode ---------- */
function encode(o){o=o||P;const v=KEYS.map(k=>COLOR_KEYS.includes(k)?String(o[k]).replace('#',''):String(o[k]));try{return 'WD2.'+btoa(v.join(','));}catch(e){return '';}}
function decode(str){
  str=(str||'').trim();
  let keys=KEYS, v1=false;
  if(str.startsWith('WD2.'))str=str.slice(4);else if(str.startsWith('WD1.')){str=str.slice(4);keys=V1_KEYS;v1=true;}else return null;
  let raw;try{raw=atob(str);}catch(e){return null;}
  const parts=raw.split(',');if(parts.length!==keys.length)return null;
  const o=Object.assign({},DEFAULTS);
  for(let i=0;i<keys.length;i++){
    const k=keys[i],v=parts[i];const base=k.replace(/_[LR]$/,'');
    if(COLOR_KEYS.includes(k)){if(!/^[0-9a-fA-F]{6}$/.test(v))return null;o[k]='#'+v.toLowerCase();}
    else{const n=parseInt(v,10);if(isNaN(n))return null;const max=CHOICE_MAX[base]!==undefined?CHOICE_MAX[base]:100;o[k]=clamp(n,0,max);}
  }
  if(v1){if(o.eyeShadow>2)o.eyeShadow=0;SIDE_KEYS.forEach(k=>{o[k+'_L']=o[k];o[k+'_R']=o[k];});o.sym=1;o.light=1;}
  return o;
}

function undo(){if(!hist.u.length)return;hist.r.push(lastCommitted);const c=hist.u.pop();P=decode(c);lastCommitted=c;currentPreset=-1;refreshAll();refreshHistBtns();persist();}
function redo(){if(!hist.r.length)return;hist.u.push(lastCommitted);const c=hist.r.pop();P=decode(c);lastCommitted=c;currentPreset=-1;refreshAll();refreshHistBtns();persist();}
function refreshHistBtns(){$('#btnUndo').disabled=!hist.u.length;$('#btnRedo').disabled=!hist.r.length;}

  $('#btnSym').setAttribute('aria-pressed',P.sym?'true':'false');
  $('#btnLight').textContent='光照：'+['左側','正面','右側'][P.light];
  $('#sideL').setAttribute('aria-pressed',activeSide<0?'true':'false');$('#sideR').setAttribute('aria-pressed',activeSide>0?'true':'false');
}
function refreshAll(){buildPanel();draw();}
function toast(msg,el){const t=$(el||'#toast');t.textContent=msg;clearTimeout(t._h);t._h=setTimeout(()=>{t.textContent='';},2600);}
function persist(){try{localStorage.setItem('wd2_last',encode());localStorage.setItem('wd2_preset',String(currentPreset));}catch(e){}}

/* drag handles */
(function(){
  let drag=null;
  function toSvg(e){const pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;const m=svg.getScreenCTM();if(!m)return {x:0,y:0};const p=pt.matrixTransform(m.inverse());return {x:p.x,y:p.y};}
  svg.addEventListener('pointerdown',e=>{
    const g=e.target.closest&&e.target.closest('.handle');if(!g)return;
    const h=handles.find(x=>x.id===g.dataset.id);if(!h)return;
    e.preventDefault();
    const start={};h.maps.forEach(m=>{start[m.k]=(h.side===0||P.sym)?P[m.k]:sv(m.k,h.side);});
    drag={h,start,p0:toSvg(e)};
    if(!P.sym&&h.side!==0&&h.side!==activeSide){activeSide=h.side;buildPanel();}
    svg.setPointerCapture(e.pointerId);
  });
  svg.addEventListener('pointermove',e=>{
    if(!drag)return;const p=toSvg(e);const dx=p.x-drag.p0.x,dy=p.y-drag.p0.y;
    drag.h.maps.forEach(m=>{const d=m.axis==='x'?dx:dy;const val=clamp(Math.round(drag.start[m.k]+d/m.scale*100*m.sign),0,100);
      if(SIDE_KEYS.includes(m.k)&&drag.h.side!==0)setSide(m.k,drag.h.side,val);else P[m.k]=val;});
    currentPreset=-1;refreshValues();draw();
  });
  const end=()=>{if(!drag)return;drag=null;commit();};
  svg.addEventListener('pointerup',end);svg.addEventListener('pointercancel',end);
})();

/* gallery */
function thumbSvg(o){const s=document.createElementNS('http://www.w3.org/2000/svg','svg');s.setAttribute('viewBox','0 0 600 760');render(s,o,{thumb:true});return s;}
function loadSaved(){try{return JSON.parse(localStorage.getItem('wd2_saved')||'[]');}catch(e){return [];}}
function openGallery(){
  const gp=$('#galPresets');gp.innerHTML='';
  PRESETS.forEach((p,i)=>{const b=document.createElement('button');b.type='button';b.className='thumb';b.appendChild(thumbSvg(fromPreset(i)));b.insertAdjacentHTML('beforeend',`<span class="t">${p.name}</span><span class="s">${p.info}</span>`);b.addEventListener('click',()=>{P=fromPreset(i);currentPreset=i;refreshAll();commit();closeOv('#ovGallery');toast(`已套用「${p.name}」`);});gp.appendChild(b);});
  const saved=loadSaved();const gs=$('#galSaved');gs.innerHTML='';$('#galEmpty').hidden=saved.length>0;
  saved.forEach((it,i)=>{const o=decode(it.code);if(!o)return;const b=document.createElement('div');b.className='thumb';b.tabIndex=0;b.setAttribute('role','button');b.appendChild(thumbSvg(o));b.insertAdjacentHTML('beforeend',`<span class="t">${it.name}</span><span class="s">${it.date}</span>`);
    const load=()=>{P=o;currentPreset=-1;refreshAll();commit();closeOv('#ovGallery');toast(`已載入「${it.name}」`);};
    b.addEventListener('click',load);b.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();load();}});
    const del=document.createElement('button');del.type='button';del.className='chip';del.textContent='刪除';del.addEventListener('click',ev=>{ev.stopPropagation();const arr=loadSaved();arr.splice(i,1);try{localStorage.setItem('wd2_saved',JSON.stringify(arr));}catch(e){}openGallery();});b.appendChild(del);gs.appendChild(b);});
  $('#ovGallery').hidden=false;
}
function closeOv(sel){$(sel).hidden=true;}
function saveFace(){
  const arr=loadSaved();const n=arr.length+1;const d=new Date();
  arr.unshift({name:'臉譜 '+n,code:encode(),date:`${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`});
  if(arr.length>12)arr.length=12;
  try{localStorage.setItem('wd2_saved',JSON.stringify(arr));toast('已存入臉譜庫（這個瀏覽器）');}catch(e){toast('這個瀏覽器不允許儲存，請改用分享數據');}
}
/* share */
function openShare(){
  const code=encode();$('#codeOut').value=code;
  const box=$('#qr');box.innerHTML='';
  try{if(window.QRCode){new QRCode(box,{text:code,width:152,height:152,colorDark:'#1d2530',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.L});}else box.textContent='二維碼元件未載入，請用文字數據。';}catch(e){box.textContent='數據過長，請用文字數據。';}
  $('#ovShare').hidden=false;
}

/* random */
const pick=arr=>arr[Math.floor(Math.random()*arr.length)];
const rnd=(a,b)=>Math.round(a+Math.random()*(b-a));
function randomKey(k){
  if(COLOR_KEYS.includes(k))return k==='skin'?pick(SKINS):k==='iris'?pick(IRISES):pick(HAIRS);
  if(k==='sym'||k==='light')return P[k];
  if(CHOICE_MAX[k]!==undefined)return rnd(0,CHOICE_MAX[k]);
  return rnd(15,85);
}
function randomize(keys){
  keys.forEach(k=>{const v=randomKey(k);P[k]=v;if(SIDE_KEYS.includes(k)){P[k+'_L']=v;P[k+'_R']=v;}});
  if(P.hairStyle===4)P.bangs=3;
  if(keys.includes('scar')&&Math.random()<0.6)P.scar=0;
  if(keys.includes('beard')&&Math.random()<0.5)P.beard=0;
  if(keys.includes('faling')&&Math.random()<0.6){P.faling=0;P.wrinkle=0;}
  currentPreset=-1;refreshAll();commit();
}
function catKeys(id){return CATS.find(c=>c.id===id).controls.filter(c=>c.k).map(c=>c.k);}

/* wire */
buildRail();
$('#btnSym').addEventListener('click',()=>{P.sym=P.sym?0:1;if(P.sym){SIDE_KEYS.forEach(k=>{const v=Math.round((P[k+'_L']+P[k+'_R'])/2);P[k]=v;P[k+'_L']=v;P[k+'_R']=v;});}refreshAll();commit();toast(P.sym?'已開啟左右對稱':'已關閉對稱，可分別調整左右');});
$('#btnLight').addEventListener('click',()=>{P.light=(P.light+1)%3;refreshValues();draw();commit();});
$('#sideL').addEventListener('click',()=>{activeSide=-1;refreshAll();});
$('#sideR').addEventListener('click',()=>{activeSide=1;refreshAll();});
$('#camFull').addEventListener('click',()=>{cam='full';$('#camFull').setAttribute('aria-pressed','true');$('#camFace').setAttribute('aria-pressed','false');draw();});
$('#camFace').addEventListener('click',()=>{cam='face';$('#camFull').setAttribute('aria-pressed','false');$('#camFace').setAttribute('aria-pressed','true');draw();});
const cmp=$('#btnCompare');
const cmpOn=()=>{const base=currentPreset>=0?fromPreset(currentPreset):(hist.u.length?decode(hist.u[0]):null);if(!base){toast('目前沒有可對比的原貌');return;}compareBase=base;cmp.setAttribute('aria-pressed','true');draw();};
const cmpOff=()=>{if(!compareBase)return;compareBase=null;cmp.setAttribute('aria-pressed','false');draw();};
cmp.addEventListener('pointerdown',e=>{e.preventDefault();cmpOn();});cmp.addEventListener('pointerup',cmpOff);cmp.addEventListener('pointerleave',cmpOff);cmp.addEventListener('pointercancel',cmpOff);
cmp.addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();cmpOn();}});cmp.addEventListener('keyup',cmpOff);
$('#btnUndo').addEventListener('click',undo);$('#btnRedo').addEventListener('click',redo);
$('#btnRandCat').addEventListener('click',()=>{randomize(catKeys(activeCat));toast('隨機了「'+CATS.find(c=>c.id===activeCat).name+'」');});
$('#btnRandAll').addEventListener('click',()=>{randomize(BASE_KEYS);toast('隨機捏了一張臉');});
$('#btnReset').addEventListener('click',()=>{const base=currentPreset>=0?fromPreset(currentPreset):fromPreset(0);catKeys(activeCat).forEach(k=>{P[k]=base[k];if(SIDE_KEYS.includes(k)){P[k+'_L']=base[k];P[k+'_R']=base[k];}});refreshAll();commit();toast('已重置本區');});
$('#btnGallery').addEventListener('click',openGallery);$('#galClose').addEventListener('click',()=>closeOv('#ovGallery'));
$('#btnSave').addEventListener('click',saveFace);
$('#btnShare').addEventListener('click',openShare);$('#shClose').addEventListener('click',()=>closeOv('#ovShare'));
document.querySelectorAll('.overlay').forEach(ov=>ov.addEventListener('click',e=>{if(e.target===ov)ov.hidden=true;}));
document.addEventListener('keydown',e=>{if(e.key==='Escape'){document.querySelectorAll('.overlay').forEach(o=>o.hidden=true);}
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();if(e.shiftKey)redo();else undo();}});
$('#btnCopy').addEventListener('click',()=>{const ta=$('#codeOut');const txt=ta.value;const fb=()=>{ta.focus();ta.select();toast('已選取數據，請按複製','#toast2');};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(()=>toast('數據已複製','#toast2')).catch(fb);}else fb();});
$('#btnImport').addEventListener('click',()=>{const o=decode($('#codeIn').value);if(o){P=o;currentPreset=-1;refreshAll();commit();closeOv('#ovShare');toast('數據已載入');}else toast('數據格式不對，請確認以 WD2. 或 WD1. 開頭且完整','#toast2');});

/* boot */
function start(data){
  let loaded=false;
  if(data&&data.code){const o=decode(data.code);if(o){P=o;currentPreset=typeof data.preset==='number'?data.preset:-1;loaded=true;}}
  if(!loaded){try{const c=localStorage.getItem('wd2_last');const o=c&&decode(c);if(o){P=o;const pi=parseInt(localStorage.getItem('wd2_preset')||'-1',10);currentPreset=isNaN(pi)?-1:pi;loaded=true;}const t=localStorage.getItem('wd2_cat');if(t&&CATS.some(x=>x.id===t)){activeCat=t;refreshRail();}}catch(e){}}
  if(!loaded){P=fromPreset(0);currentPreset=0;}
  lastCommitted=encode();
  refreshAll();refreshHistBtns();
}
try{window.claude?.hot?.snapshot?.(()=>({code:encode(),preset:currentPreset}));}catch(e){}
if(window.claude?.hot?.ready){window.claude.hot.ready(start);}else{start(window.claude?.hot?.data??{});}
})();
</script>
