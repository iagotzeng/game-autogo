/* ---------- geometry helpers ---------- */
function smoothClosed(pts){
  const n=pts.length;let d=`M${f(pts[0][0])} ${f(pts[0][1])}`;

    const p0=pts[(i-1+n)%n],p1=pts[i],p2=pts[(i+1)%n],p3=pts[(i+2)%n];
    d+=` C${f(p1[0]+(p2[0]-p0[0])/6)} ${f(p1[1]+(p2[1]-p0[1])/6)} ${f(p2[0]-(p3[0]-p1[0])/6)} ${f(p2[1]-(p3[1]-p1[1])/6)} ${f(p2[0])} ${f(p2[1])}`;
  }

function qpt(p0,p1,p2,t){const u=1-t;return [u*u*p0[0]+2*u*t*p1[0]+t*t*p2[0],u*u*p0[1]+2*u*t*p1[1]+t*t*p2[1]];}
// tapered stroke along quadratic curve: thickness w at start, w*endF at end
function taperedQuad(p0,p1,p2,w,endF,startF){
  const up=[],dn=[];const N=14;
  for(let i=0;i<=N;i++){
    const t=i/N;const p=qpt(p0,p1,p2,t);
    const q=qpt(p0,p1,p2,Math.min(1,t+0.01)),r=qpt(p0,p1,p2,Math.max(0,t-0.01));

  }

  return 'M'+all.map(p=>f(p[0])+' '+f(p[1])).join(' L ')+'Z';

/* ---------- code encode / decode ---------- */
function encode(){
  const v=KEYS.map(k=>COLOR_KEYS.includes(k)?String(P[k]).replace('#',''):String(P[k]));
  try{return 'WD1.'+btoa(v.join(','));}catch(e){return '';}
}
function decode(str){
  str=(str||'').trim();
  if(!str.startsWith('WD1.'))return null;
  let raw;try{raw=atob(str.slice(4));}catch(e){return null;}
  const parts=raw.split(',');if(parts.length!==KEYS.length)return null;
  const o={};
  for(let i=0;i<KEYS.length;i++){
    const k=KEYS[i],v=parts[i];
    if(COLOR_KEYS.includes(k)){if(!/^[0-9a-fA-F]{6}$/.test(v))return null;o[k]='#'+v.toLowerCase();}
    else{const n=parseInt(v,10);if(isNaN(n))return null;const max=CHOICE_MAX[k]!==undefined?CHOICE_MAX[k]:100;o[k]=Math.max(0,Math.min(max,n));}
  }
  return o;
}

/* ---------- UI ---------- */
const panes=$('#panes'), tabsEl=$('#tabs');
let activeTab='face';
function buildUI(){
  TABS.forEach(tab=>{
    const b=document.createElement('button');b.type='button';b.className='tab';b.role='tab';b.id='tab-'+tab.id;b.textContent=tab.name;
    b.setAttribute('aria-selected',tab.id===activeTab?'true':'false');
    b.addEventListener('click',()=>{activeTab=tab.id;refreshTabs();try{localStorage.setItem('wd_tab',activeTab);}catch(e){}});
    tabsEl.appendChild(b);
    const pane=document.createElement('div');pane.className='pane';pane.id='pane-'+tab.id;pane.hidden=tab.id!==activeTab;
    tab.controls.forEach(c=>{
      if(c.t==='group'){const g=document.createElement('div');g.className='group-title';g.textContent=c.n;pane.appendChild(g);return;}
      const wrap=document.createElement('div');wrap.className='ctl';wrap.dataset.key=c.k;
      const lab=document.createElement('div');lab.className='lab';
      const nm=document.createElement('b');nm.textContent=c.n;lab.appendChild(nm);
      if(c.t==='slider'){
        const v=document.createElement('span');v.className='v';v.id='v-'+c.k;lab.appendChild(v);
        wrap.appendChild(lab);
        const inp=document.createElement('input');inp.type='range';inp.min=0;inp.max=100;inp.id='in-'+c.k;inp.setAttribute('aria-label',c.n);
        inp.addEventListener('input',()=>{P[c.k]=+inp.value;v.textContent=inp.value;currentPreset=-1;render();persist();});
        wrap.appendChild(inp);
      }else if(c.t==='choice'){
        wrap.appendChild(lab);
        const ch=document.createElement('div');ch.className='choices';ch.id='ch-'+c.k;
        c.o.forEach((name,i)=>{const bt=document.createElement('button');bt.type='button';bt.className='chip';bt.textContent=name;bt.id=`ch-${c.k}-${i}`;
          bt.addEventListener('click',()=>{P[c.k]=i;currentPreset=-1;refreshValues();render();persist();});ch.appendChild(bt);});
        wrap.appendChild(ch);
      }else if(c.t==='color'){
        wrap.appendChild(lab);
        const row=document.createElement('div');row.className='colors';row.id='co-'+c.k;
        c.sw.forEach((hex,i)=>{const sw=document.createElement('button');sw.type='button';sw.className='sw';sw.id=`co-${c.k}-${i}`;sw.setAttribute('aria-label',c.n+' '+hex);sw.innerHTML=`<span style="background:${hex}"></span>`;
          sw.addEventListener('click',()=>{P[c.k]=hex;currentPreset=-1;refreshValues();render();persist();});row.appendChild(sw);});
        const ci=document.createElement('input');ci.type='color';ci.id='in-'+c.k;ci.setAttribute('aria-label',c.n+' 自訂');
        ci.addEventListener('input',()=>{P[c.k]=ci.value;currentPreset=-1;refreshValues();render();persist();});
        row.appendChild(ci);wrap.appendChild(row);
      }
      pane.appendChild(wrap);
    });
    panes.appendChild(pane);
  });
  const pr=$('#presets');
  PRESETS.forEach((p,i)=>{const b=document.createElement('button');b.type='button';b.className='chip';b.id='preset-'+i;b.textContent=p.name;
    b.addEventListener('click',()=>{applyPreset(i);});pr.appendChild(b);});
}
function refreshTabs(){
  TABS.forEach(t=>{$('#tab-'+t.id).setAttribute('aria-selected',t.id===activeTab?'true':'false');$('#pane-'+t.id).hidden=t.id!==activeTab;});
}
function refreshValues(){
  TABS.forEach(tab=>tab.controls.forEach(c=>{
    if(c.t==='slider'){$('#in-'+c.k).value=P[c.k];$('#v-'+c.k).textContent=P[c.k];}
    else if(c.t==='choice'){c.o.forEach((_,i)=>$(`#ch-${c.k}-${i}`).setAttribute('aria-pressed',P[c.k]===i?'true':'false'));}
    else if(c.t==='color'){c.sw.forEach((hex,i)=>$(`#co-${c.k}-${i}`).setAttribute('aria-pressed',P[c.k]===hex?'true':'false'));$('#in-'+c.k).value=P[c.k];}
  }));
  PRESETS.forEach((_,i)=>$('#preset-'+i).setAttribute('aria-pressed',currentPreset===i?'true':'false'));
}
function applyPreset(i){currentPreset=i;P=Object.assign({},PRESETS[i].p);refreshValues();render();persist();toast(`已套用「${PRESETS[i].name}」`);}
function toast(msg){const t=$('#toast');t.textContent=msg;clearTimeout(toast.h);toast.h=setTimeout(()=>{t.textContent='';},2600);}
function persist(){try{localStorage.setItem('wd_last',encode());localStorage.setItem('wd_preset',String(currentPreset));}catch(e){}}

const pick=arr=>arr[Math.floor(Math.random()*arr.length)];
const rnd=(a,b)=>Math.round(a+Math.random()*(b-a));
function randomize(){
  const o={};
  KEYS.forEach(k=>{
    if(COLOR_KEYS.includes(k)){o[k]=k==='skin'?pick(SKINS):k==='iris'?pick(IRISES):pick(HAIRS);}
    else if(CHOICE_MAX[k]!==undefined){o[k]=rnd(0,CHOICE_MAX[k]);}
    else o[k]=rnd(15,85);
  });
  if(o.hairStyle===4)o.bangs=3;
  if(Math.random()<0.6)o.scar=0;
  if(Math.random()<0.5)o.beard=0;
  P=o;currentPreset=-1;refreshValues();render();persist();toast('隨機捏了一張臉');
}

buildUI();
// boot: hot snapshot > localStorage > default preset
function start(data){
  let loaded=false;
  if(data&&data.code){const o=decode(data.code);if(o){P=o;currentPreset=typeof data.preset==='number'?data.preset:-1;loaded=true;}}
  if(!loaded){try{const c=localStorage.getItem('wd_last');const o=c&&decode(c);if(o){P=o;const pi=parseInt(localStorage.getItem('wd_preset')||'-1',10);currentPreset=isNaN(pi)?-1:pi;loaded=true;}const t=localStorage.getItem('wd_tab');if(t&&TABS.some(x=>x.id===t)){activeTab=t;refreshTabs();}}catch(e){}}
  if(!loaded){P=Object.assign({},PRESETS[0].p);currentPreset=0;}
  refreshValues();render();
}
try{window.claude?.hot?.snapshot?.(()=>({code:encode(),preset:currentPreset}));}catch(e){}
if(window.claude?.hot?.ready){window.claude.hot.ready(start);}else{start(window.claude?.hot?.data??{});}

$('#btnRandom').addEventListener('click',randomize);
$('#btnReset').addEventListener('click',()=>{applyPreset(currentPreset>=0?currentPreset:0);});
$('#btnSave').addEventListener('click',()=>{try{localStorage.setItem('wd_saved',encode());toast('已存到這個瀏覽器');}catch(e){toast('這個瀏覽器不允許儲存，請改用代碼');}});
$('#btnLoad').addEventListener('click',()=>{let c=null;try{c=localStorage.getItem('wd_saved');}catch(e){}const o=c&&decode(c);if(o){P=o;currentPreset=-1;refreshValues();render();persist();toast('已讀取我的臉');}else toast('還沒有存過臉');});
$('#btnCopy').addEventListener('click',()=>{const ta=$('#codeOut');const txt=ta.value;
  const fallback=()=>{ta.focus();ta.select();toast('已選取代碼，請按複製');};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(()=>toast('代碼已複製')).catch(fallback);}else fallback();});
$('#btnImport').addEventListener('click',()=>{const o=decode($('#codeIn').value);if(o){P=o;currentPreset=-1;refreshValues();render();persist();toast('代碼已載入');}else toast('代碼格式不對，請確認以 WD1. 開頭且完整');});
})();
</script>
